<!DOCTYPE html>
<html lang="ko" data-theme="light" data-market="us">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>SIGMA OS // ORDERBLOCK VAULT &amp; INBOX</title>
  <meta name="description" content="ORDERBLOCK Finance 디자인 시스템 기반 시그마 OS 비공개 Obsidian 볼트 뷰어, 수집함, 생각 노트 및 6종목 투자 터미널" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="ob-nav">
    <div class="ob-nav__mark" id="brand-home" title="SIGMA OS 홈(분류하기)으로 이동">
      <span class="ob-ticker">Σ</span>
      <span>SIGMA OS</span>
      <span class="ob-badge" id="connection-badge">LOADING</span>
    </div>

    <nav class="ob-nav__links" aria-label="주요 화면 전환 (데스크톱)">
      <button class="ob-nav__link is-active" data-tab="triage" id="tab-btn-triage">01 // 분류하기 · 홈</button>
      <button class="ob-nav__link" data-tab="inbox" id="tab-btn-inbox">02 // 시그마 수집함</button>
      <button class="ob-nav__link" data-tab="thoughts" id="tab-btn-thoughts">03 // 생각 · 참고 · 영구노트</button>
      <button class="ob-nav__link" data-tab="investing" id="tab-btn-investing">04 // 투자 &amp; LLM 위키</button>
      <button class="ob-nav__link" data-tab="explorer" id="tab-btn-explorer">05 // 전체 볼트 탐색기</button>
    </nav>

    <div class="ob-nav__actions">
      <button class="ob-btn ob-btn--sm" id="btn-open-search" title="볼트 전체 검색 (Ctrl+K)">SEARCH</button>
      <button class="ob-btn ob-btn--sm" id="btn-market-toggle" title="등락 색상 기준 전환 (US: 초록 상승 / KR: 빨강 상승)">US ▲</button>
      <button class="ob-btn ob-btn--sm" id="btn-sync-now" title="볼트 최신 데이터 새로고침">SYNC ↗</button>
      <button class="ob-btn ob-btn--sm" id="btn-theme-toggle" title="화이트 모드 / 다크 모드 테마 전환">THEME</button>
    </div>
  </header>

  <main class="workspace">
    <h1 class="sr-only" style="position:absolute;left:-9999px;">SIGMA OS ORDERBLOCK FINANCE VAULT &amp; INBOX TERMINAL</h1>
    <div id="stats-container" class="ob-statrow"></div>
    <div id="view-container"></div>
  </main>

  <!-- Dedicated Mobile Fixed Bottom Tab Bar -->
  <nav class="mobile-bottom-nav" aria-label="모바일 하단 메뉴">
    <button class="mobile-bottom-nav__btn is-active" data-tab="triage">
      <span class="mobile-bottom-nav__num">01</span>
      <span>홈·분류</span>
    </button>
    <button class="mobile-bottom-nav__btn" data-tab="inbox">
      <span class="mobile-bottom-nav__num">02</span>
      <span>수집함</span>
    </button>
    <button class="mobile-bottom-nav__btn" data-tab="thoughts">
      <span class="mobile-bottom-nav__num">03</span>
      <span>생각·참고</span>
    </button>
    <button class="mobile-bottom-nav__btn" data-tab="investing">
      <span class="mobile-bottom-nav__num">04</span>
      <span>투자·위키</span>
    </button>
    <button class="mobile-bottom-nav__btn" data-tab="explorer">
      <span class="mobile-bottom-nav__num">05</span>
      <span>볼트전체</span>
    </button>
  </nav>

  <footer class="ob-footer">
    <div class="ob-footer__base">
      <div><strong>SIGMA OS // ORDERBLOCK FINANCE TERMINAL</strong> — RAW STRUCTURE. DEEP WATER. CLEAR SIGNALS.</div>
      <div id="footer-meta">VAULT: EXON6/OBSIDIAN-VAULT · PRIVATE API DIRECT · ZERO RADIUS</div>
    </div>
  </footer>

  <!-- Search Modal -->
  <div class="modal-backdrop" id="search-modal">
    <div class="modal">
      <div class="modal-header">
        <span>SEARCH // 볼트 전체 검색</span>
        <button class="ob-btn ob-btn--xs" id="btn-close-search">CLOSE [ESC]</button>
      </div>
      <div class="modal-body">
        <input type="text" class="input" id="search-input" placeholder="QUERY: NVDA, VERA RUBIN, 포카요케, LUMENTUM, 신용 점검, 할일..." autocomplete="off" />
        <div id="search-results" style="margin-top:16px;"></div>
      </div>
    </div>
  </div>

  <!-- Auth & Security Modal -->
  <div class="modal-backdrop" id="auth-modal">
    <div class="modal">
      <div class="modal-header">
        <span>AUTH // 비공개 GITHUB 볼트 연결</span>
        <button class="ob-btn ob-btn--xs" id="btn-close-auth">CLOSE [✕]</button>
      </div>
      <div class="modal-body" id="auth-modal-body"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="v2.js"></script>
  <script src="app.js"></script>
</body>
</html>
